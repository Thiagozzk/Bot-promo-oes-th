<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Bot Promo PC</title><style>body{font-family:system-ui;background:#0d0f12;color:#eee;margin:0}.w{max-width:1050px;margin:auto;padding:28px}.card{background:#171a20;border:1px solid #292e38;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.n{font-size:26px;font-weight:800}.muted{color:#9ca3af}button,a.b{background:#16a34a;color:#fff;border:0;padding:10px 14px;border-radius:9px;text-decoration:none;font-weight:700;cursor:pointer}input{padding:10px;border-radius:9px;border:1px solid #333;background:#0d0f12;color:#fff}.o{padding:14px 0;border-top:1px solid #292e38;display:flex;justify-content:space-between;gap:15px}.off{font-weight:800;color:#5fda8b}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class=w><h1>🖥️ Bot Promo PC</h1><div class=card><div class=grid><div><span class=muted>WhatsApp</span><div class=n id=wa>-</div></div><div><span class=muted>Ofertas</span><div class=n id=total>-</div></div><div><span class=muted>Filtro</span><div class=n id=min>-</div></div><div><span class=muted>Auto envio</span><div class=n id=auto>-</div></div></div></div><div class=card><a class=b href=/whatsapp>Conectar WhatsApp</a> <input id=k type=password placeholder="ADMIN_KEY"> <button onclick=scan()>Buscar agora</button><span id=m></span></div><div class=card><b>Fontes</b><p class=muted id=src></p></div><div class=card><b>Últimas ofertas</b><div id=list></div></div></div><script>
async function load(){let s=await fetch('/api/status').then(r=>r.json());wa.textContent=s.whatsapp.ready?'ONLINE':'QR';total.textContent=s.total;min.textContent=s.minDiscount+'%';auto.textContent=s.autoSend?'SIM':'NÃO';src.textContent=`Mercado Livre: ${s.ml?'OK':'falta token'} • AliExpress: ${s.aliexpress?'OK':'faltam chaves'} • Feed extra: ${s.feed?'OK':'opcional'}`;let a=await fetch('/api/offers').then(r=>r.json());list.innerHTML=a.map(o=>`<div class=o><div><b>${e(o.title)}</b><div class=muted>${e(o.store)} • R$ ${Number(o.price).toFixed(2)} • <span class=off>${Math.round(o.discount)}% OFF</span> • ${o.sent_at?'enviada':'não enviada'}</div></div><button onclick="send('${o.id}')">Enviar</button></div>`).join('')||'<p class=muted>Nenhuma oferta encontrada ainda.</p>'}
function e(x){return String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function scan(){m.textContent=' buscando...';let r=await fetch('/api/scan',{method:'POST',headers:{'x-admin-key':k.value}});m.textContent=' '+JSON.stringify(await r.json());load()}async function send(id){let r=await fetch('/api/send/'+id,{method:'POST',headers:{'x-admin-key':k.value}});alert(JSON.stringify(await r.json()));load()}load();setInterval(load,15000)</script></body></html>
